[server]
host = 0.0.0.0
port = 8080
cert_file = /etc/ac-manager/cert.pem
key_file = /etc/ac-manager/key.pem
ca_file = /etc/ac-manager/ca.pem

[database]
type = sqlite
path = /var/lib/ac-manager/ac.db

[redis]
enabled = false
host = 127.0.0.1
port = 6379
password = 

[heartbeat]
interval = 30
timeout = 120

[logging]
level = info
file = /var/log/ac-manager.log
max_size = 10485760
rotate_count = 5